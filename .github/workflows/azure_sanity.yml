name: Azure Sanity (Read-only Dry Run)

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sanity:
    # Fork and Dependabot pull requests never receive secrets; skip them
    # explicitly rather than passing vacuously. Every other run needs them.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      REPORT_PATH: azure_sanity_report.json

    steps:
      - name: Require secrets (fail if not configured)
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          missing=()
          [[ -z "${AZURE_CLIENT_ID}" ]] && missing+=("AZURE_CLIENT_ID")
          [[ -z "${AZURE_TENANT_ID}" ]] && missing+=("AZURE_TENANT_ID")
          [[ -z "${AZURE_SUBSCRIPTION_ID}" ]] && missing+=("AZURE_SUBSCRIPTION_ID")
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Azure sanity cannot run: missing secrets: ${missing[*]}"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: pkg/go.mod
          cache-dependency-path: '**/go.sum'

      - name: Azure Login (OIDC)
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build + Run Azure sanity
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          go test -race ./ci_cd_sanity_tests/... -count=1
          go build -o azure-sanity ./ci_cd_sanity_tests/cmd/azure_sanity
          ./azure-sanity \
            --subscription-id "${AZURE_SUBSCRIPTION_ID}" \
            --expected-subscription "${AZURE_SUBSCRIPTION_ID}" \
            --expected-tenant "${AZURE_TENANT_ID}" \
            --out "${REPORT_PATH}"

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: azure-sanity-report
          path: ${{ env.REPORT_PATH }}
          if-no-files-found: ignore
