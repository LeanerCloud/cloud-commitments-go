name: AWS Sanity (Read-only Dry Run)

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sanity:
    # Fork and Dependabot pull requests never receive secrets; skip them
    # explicitly rather than passing vacuously. Every other run needs them.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: us-east-1
      REPORT_PATH: sanity_report.json
      EXPECTED_ACCOUNT: ${{ secrets.AWS_EXPECTED_ACCOUNT_ID }}

    steps:
      - name: Require secrets (fail if not configured)
        shell: bash
        env:
          AWS_CICD_READONLY_ROLE_ARN: ${{ secrets.AWS_CICD_READONLY_ROLE_ARN }}
          AWS_EXPECTED_ACCOUNT_ID: ${{ secrets.AWS_EXPECTED_ACCOUNT_ID }}
        run: |
          missing=()
          [[ -z "${AWS_CICD_READONLY_ROLE_ARN}" ]] && missing+=("AWS_CICD_READONLY_ROLE_ARN")
          [[ -z "${AWS_EXPECTED_ACCOUNT_ID}" ]] && missing+=("AWS_EXPECTED_ACCOUNT_ID")
          if (( ${#missing[@]} > 0 )); then
            echo "::error::AWS sanity cannot run: missing secrets: ${missing[*]}"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: pkg/go.mod
          cache-dependency-path: '**/go.sum'

      - name: Configure AWS credentials via OIDC (read-only role)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_CICD_READONLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: cc-go-sanity

      - name: Build
        run: |
          go test -race ./ci_cd_sanity_tests/... -count=1
          go build -o sanity ./ci_cd_sanity_tests/cmd/sanity

      - name: Run sanity (read-only)
        run: |
          ./sanity \
            --region "${AWS_REGION}" \
            --expected-account "${EXPECTED_ACCOUNT}" \
            --out "${REPORT_PATH}"

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aws-sanity-report
          path: ${{ env.REPORT_PATH }}
          if-no-files-found: ignore
